services:
  - type: web
    name: denso-incident-api
    runtime: docker
    plan: free
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://denso-incident-web.onrender.com
      - key: INAV_AI_MODE
        value: knowledge
      - key: INAV_DATA_POLICY
        value: local_only

  - type: web
    name: denso-incident-web
    runtime: static
    branch: dev
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://denso-incident-api.onrender.com/api/v1
